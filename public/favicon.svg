	<rect class="o" x="2" y="2" width="14" height="14" rx="2.5" stroke-width="2.4" />
	<rect class="c" x="8" y="8" width="14" height="14" rx="2.5" stroke-width="2.4" stroke-dasharray="3 2.2" />
